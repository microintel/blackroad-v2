    <script>
        /* Routing is hash-based (index.html#/income) so any static server works.
           Convert older URL shapes before the app starts:
             /income            (server fell back to index.html)  ->  /#/income
             /app/income        (app hosted in a sub-folder)      ->  /app/#/income
             index.html?go=/x   (older hard reloads)              ->  index.html#/x
           and drop the throwaway ?_= reload marker. */
        (function () {
            try {
                var l = location, q = new URLSearchParams(l.search);
                var go = q.get("go"), route = null, base = l.pathname;
                if (go && go.charAt(0) === "/") {
                    route = go;
                } else if (!l.hash) {
                    /* Only a known route name at the END of the path is a route.
                       The app folder itself (e.g. /blackroad-v2/ on GitHub Pages)
                       is not, and is kept as the base. */
                    var m = l.pathname.match(/^(.*\/)(dashboard|income|stocks|deposits|lending|mutualfund|stepup|intelligence|calculators|accounting|data|notifications|account|login|register)\/?$/);
                    if (m) {
                        route = "/" + m[2];
                        base = m[1];
                    }
                }
                if (route) {
                    history.replaceState({}, "", base + "#" + route);
                } else if (q.has("_")) {
                    history.replaceState({}, "", l.pathname + l.hash);
                }
            } catch (e) { /* ignore */ }
        })();
    </script>

    <script>
        /* Apply the saved theme (or the system theme on a first visit)
           before first paint, so there is no flash of the wrong theme.
           Keep the storage key and logic in sync with services/preferences.js. */
        (function () {
            var d = document.documentElement, theme = "dark";
            try {
                var saved = localStorage.getItem("br-theme");
                if (saved === "light" || saved === "dark") {
                    theme = saved;
                } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
                    theme = "light";
                }
            } catch (e) { /* storage blocked: fall back to dark */ }
            d.setAttribute("data-theme", theme);
            try {
                var v = localStorage.getItem("br-variant");
                var okV = (theme === "light" && v === "ivory-forest");
                if (okV) d.setAttribute("data-variant", v);
                var tc = okV ? v : null;
            } catch (e) { /* ignore */ }
            d.setAttribute("data-style", "flat");
            d.setAttribute("data-accent", "gold");
            var m = document.querySelector('meta[name="theme-color"]');
            var C = {"light": "#EEECE7", "dark": "#000000", "ivory-forest": "#F5F4EF"}; if (m) m.setAttribute("content", C[tc || theme]);
        })();
    </script>

    </script>
